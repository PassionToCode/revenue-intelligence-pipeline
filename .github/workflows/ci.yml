# CI for the the client revenue-intelligence pipeline.
#
# Four independent gates; any one of them can fail the build:
#
#   evals        — correctness. Runs the pipeline and the data-quality gate
#                  (`python -m app`, exit 1 = data failed the gate, 2 = program
#                  broke), then the eval harness, then the contract-drift tests.
#                  This is the gate that proves the numbers are still right and
#                  that nobody has hardcoded a value the contract owns.
#   secrets-scan — gitleaks over the repo and its history. The brief says "don't
#                  commit secrets"; this job is the proof, not a promise.
#   sast         — semgrep static analysis of the Python source.
#   vuln-scan    — trivy over the filesystem for known-vulnerable dependencies.
#
# Scanner scope is deliberately narrowed (see the comment in each job) so a red
# check means a real finding rather than style noise.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evals:
    name: Pipeline, gate and evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The client export is deliberately NOT committed -- it carries account
      # names, billing emails and per-customer revenue. See the README. So the
      # data-dependent steps can only run where the CSV has been supplied,
      # which on a fork or a public runner it has not been.
      #
      # This is the honest trade of withholding the data: CI validates the
      # contract and the static spec/code agreement on every push, and the
      # pipeline, gate and evals run wherever the data is present -- locally,
      # or in CI once the CSV is provided as a secret or an artifact.
      - name: Check whether the client data is present
        id: data
        run: |
          if [ -f data/invoices.csv ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "data/invoices.csv is not committed by design - running static checks only"
          fi

      - name: Contract loads and is internally consistent
        run: python -c "from app.contract import Contract; c=Contract.load(); print('contract', c.version, len(c.checks), 'checks,', len(c.gold_tables), 'gold tables')"

      - name: Pipeline and data-quality gate
        if: steps.data.outputs.present == 'true'
        run: python -m app

      - name: Eval harness
        if: steps.data.outputs.present == 'true'
        run: python evals/run_evals.py

      - name: Contract-drift tests
        if: steps.data.outputs.present == 'true'
        run: python -m pytest evals -q

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and then removed is still
          # a leaked secret.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static analysis (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # semgrep's own GitHub Action is deprecated in favour of running the CLI
      # directly, which is what semgrep's docs now recommend; the range keeps it
      # off a future 2.x.
      - name: Install semgrep
        run: pip install 'semgrep>=1.90,<2'

      # Gated on ERROR-severity findings only. The lower "audit" severities flag
      # SQL assembled by string formatting, which is exactly what this pipeline
      # does on purpose: every fragment comes from the versioned contract spec in
      # specs/contract.yaml, never from user input, so there is no injection path
      # to fix. Narrowing severity is preferred here over a .semgrepignore file,
      # which would silence whole paths including future real findings.
      - name: semgrep scan
        run: >-
          semgrep scan
          --config p/python
          --config p/security-audit
          --severity ERROR
          --error
          --metrics off

  vuln-scan:
    name: Dependency vulnerabilities (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Filesystem scan rather than an image scan: it covers the same pinned
      # dependencies from requirements.txt without making CI build the image.
      # scanners is pinned to 'vuln' — secrets are the gitleaks job's gate, and
      # misconfiguration scanning is not in scope for a repo with no IaC.
      # Installed from the official apt repository rather than via
      # aquasecurity/trivy-action: the action's version tags move, and pinning
      # one that did not exist failed this job in 3 seconds with "unable to
      # resolve action". A pinned binary cannot go stale the same way.
      - name: install trivy
        run: |
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: trivy filesystem scan
        run: |
          trivy fs . \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1
